# Every dimension is a quantitative interpretation under interpretation.yaml:strategy.
# Frozen invariants, risk, execution and data settings are intentionally absent.
parameters:
  balance_value_overlap_min: {definition: "Minimum value-area overlap of the two balance-window halves", units: ratio, min: 0.40, max: 0.80, step: 0.05, rationale: "Operationalizes descriptive balance"}
  poc_migration_max: {definition: "Maximum POC migration between balance-window halves", units: ticks, min: 1, max: 8, step: 1, rationale: "Limits drifting value"}
  directional_efficiency_min: {definition: "Minimum impulse-leg path efficiency for out-of-balance", units: ratio, min: 0.40, max: 0.80, step: 0.05, rationale: "Quantifies directional movement"}
  acceptance_event_count: {definition: "Structure periods closed outside value to treat the excursion as accepted", units: events, min: 1, max: 8, step: 1, rationale: "Quantifies acceptance duration"}
  breakout_distance_ticks: {definition: "Minimum excursion beyond the balance value edge", units: ticks, min: 1, max: 12, step: 1, rationale: "Avoids tiny boundary probes"}
  displacement_zscore_min: {definition: "Minimum standardized one-period displacement in the breakout direction", units: zscore, min: 0.5, max: 3.0, step: 0.25, rationale: "Quantifies momentum/displacement"}
  impulse_min_ticks: {definition: "Minimum impulse length", units: ticks, min: 4, max: 30, step: 2, rationale: "Ensures meaningful structure-breaking leg"}
  pullback_depth_min: {definition: "Minimum retracement into the leg (also locks the leg)", units: fraction, min: 0.05, max: 0.35, step: 0.05, rationale: "Defines retracement eligibility"}
  pullback_depth_max: {definition: "Maximum retracement into the impulse at the LVN touch", units: fraction, min: 0.55, max: 0.95, step: 0.05, rationale: "Avoids nearly fully retraced impulses"}
  lvn_relative_volume_max: {definition: "Maximum LVN volume relative to the profile median", units: ratio, min: 0.25, max: 0.75, step: 0.05, rationale: "Mechanical LVN quality threshold"}
  lvn_neighbor_ratio: {definition: "Maximum LVN volume relative to neighbouring nodes", units: ratio, min: 0.4, max: 0.9, step: 0.1, rationale: "Rejects weak local minima"}
  lvn_min_width_ticks: {definition: "Minimum LVN width", units: ticks, min: 1, max: 5, step: 1, rationale: "Prevents point-noise nodes"}
  lvn_max_age_events: {definition: "Maximum age of tradable LVN", units: events, min: 20, max: 300, step: 20, rationale: "Controls stale location use"}
  lvn_max_retests: {definition: "Maximum prior retests", units: count, min: 1, max: 6, step: 1, rationale: "Controls exhausted locations"}
  aggression_delta_zscore: {definition: "Minimum signed rolling-delta z-score", units: zscore, min: 0.5, max: 3.0, step: 0.25, rationale: "Quantifies directional aggression"}
  aggression_persistence: {definition: "Required consecutive aggression observations", units: events, min: 1, max: 5, step: 1, rationale: "Avoids single-print noise"}
  stacked_imbalance_ratio: {definition: "Minimum diagonal bid/ask imbalance ratio", units: ratio, min: 1.5, max: 5.0, step: 0.5, rationale: "Quantifies footprint imbalance"}
  stacked_levels_min: {definition: "Minimum stacked imbalance levels", units: levels, min: 1, max: 6, step: 1, rationale: "Requires spatial persistence"}
  big_print_percentile: {definition: "Minimum session percentile of the largest same-direction print", units: percentile, min: 0.75, max: 0.99, step: 0.03, rationale: "Quantifies unusually large prints"}
  cvd_slope_min: {definition: "Minimum signed normalized CVD slope", units: normalized_slope, min: 0.0, max: 1.0, step: 0.1, rationale: "Confirms pressure"}
  severe_opposing_absorption: {definition: "Absorption score that blocks entry", units: ratio, min: 0.5, max: 0.95, step: 0.05, rationale: "Prevents entering into strong passive defense"}
  rejection_speed_min: {definition: "Minimum snap-back speed (reclaim velocity / attempt velocity)", units: normalized_speed, min: 0.1, max: 1.0, step: 0.1, rationale: "Quantifies failed-auction rejection"}
  stop_buffer_ticks: {definition: "Buffer beyond structural invalidation", units: ticks, min: 1, max: 3, step: 1, rationale: "Matches documented 1-2 tick concept while allowing stress testing"}
  setup_expiry_events: {definition: "Maximum setup lifetime", units: events, min: 10, max: 100, step: 10, rationale: "Prevents stale candidates"}
