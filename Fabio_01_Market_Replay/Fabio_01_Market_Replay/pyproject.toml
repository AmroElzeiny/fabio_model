[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabio-market-replay"
version = "0.1.0"
description = "Deterministic CME NQ/MNQ market replay and order-flow feature engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
databento = ["databento>=0.67"]
parquet = ["pyarrow>=18", "polars>=1.20"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6"]
all = ["databento>=0.67", "pyarrow>=18", "polars>=1.20", "pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6"]

[project.scripts]
fabio-replay = "fabio_market_replay.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
